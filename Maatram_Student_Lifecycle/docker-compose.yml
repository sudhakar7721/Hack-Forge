services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_dev_change_me}
      MYSQL_DATABASE: maatram_student_lifecycle
    ports: ["3306:3306"]
    volumes: [maatram_mysql:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-local_dev_change_me}"]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    env_file: ./backend/.env
    ports: ["8000:8000"]
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  maatram_mysql:
