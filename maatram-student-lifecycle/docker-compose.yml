services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: maatram
      MARIADB_USER: maatram
      MARIADB_PASSWORD: maatram_dev
      MARIADB_ROOT_PASSWORD: root_dev
    ports: ["3307:3306"]
    volumes: [db_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://maatram:maatram_dev@db:3306/maatram
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_BUCKET: maatram-documents
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_REGION: us-east-1
      MAX_UPLOAD_BYTES: "5242880"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY: http://backend:8000
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  db_data:
  minio_data:
